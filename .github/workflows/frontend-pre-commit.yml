name: Frontend Pre-commit

on:
  pull_request:
    branches:
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pre-commit.yml"
  push:
    branches:
      - "16.0"
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pre-commit.yml"

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # next build and vitest run on Node; bun is the package manager.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Get python version for cache
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit==4.5.1

      - name: Frontend pre-commit checks
        run: |
          # Only run pre-commit on frontend files
          git ls-files 'frontend/**' | xargs pre-commit run --show-diff-on-failure --color=always --files || exit 1
        env:
          # Skip all backend hooks, only run frontend hooks
          SKIP: forbidden-files,en-po-files,oca-update-pre-commit-excluded-addons,oca-fix-manifest-website,oca-checks-odoo-module,oca-checks-po,prettier,eslint,ruff,ruff-format,pylint_odoo

      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi
