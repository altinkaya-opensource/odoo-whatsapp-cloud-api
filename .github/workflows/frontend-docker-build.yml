name: Frontend Docker Build

on:
  pull_request:
    branches:
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"
  push:
    branches:
      - "16.0"
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: odoo-whatsapp-frontend:${{ github.sha }}
          # No type=gha cache: our Forgejo runner does not serve the artifact
          # cache API, so buildkit times out reaching it and fails the build
          # after the image has already been built.
          load: true

      - name: Test Docker image
        run: |
          # Start the container in detached mode
          docker run -d --name test-frontend -p 3000:3000 odoo-whatsapp-frontend:${{ github.sha }}

          # Wait for container to start (up to 30 seconds)
          timeout=30
          echo "Waiting for container to start..."
          while [ $timeout -gt 0 ]; do
            if docker ps | grep -q test-frontend; then
              echo "Container started successfully"
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done

          # Check if container is still running
          if ! docker ps | grep -q test-frontend; then
            echo "Container failed to start or exited"
            docker logs test-frontend
            exit 1
          fi

          # Optional: Wait a bit more for the app to be ready
          sleep 5

          # Check container logs for any errors
          echo "Container logs:"
          docker logs test-frontend

          # Stop and remove the container
          docker stop test-frontend
          docker rm test-frontend

          echo "Docker image test completed successfully"
