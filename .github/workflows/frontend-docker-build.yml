name: Frontend Docker Build

on:
  pull_request:
    branches:
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"
  push:
    branches:
      - "16.0"
      - "16.0*"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-docker-build.yml"

jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: odoo-whatsapp-frontend:${{ github.sha }}
          # No type=gha cache: our Forgejo runner does not serve the artifact
          # cache API, so buildkit times out reaching it and fails the build
          # after the image has already been built.
          load: true

      - name: Test Docker image
        run: |
          # No published port: the runner already had 3000 taken once, and the
          # check reaches the app from inside the container anyway.
          docker rm -f test-frontend 2>/dev/null || true
          docker run -d --name test-frontend odoo-whatsapp-frontend:${{ github.sha }}

          for _ in $(seq 1 30); do
            if docker exec test-frontend wget -q --spider http://127.0.0.1:3000/; then
              echo "App responded"
              docker logs test-frontend
              docker rm -f test-frontend
              exit 0
            fi
            sleep 1
          done

          echo "App never responded"
          docker logs test-frontend
          docker rm -f test-frontend
          exit 1
