name: PR-Agent
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pull_request_number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: [self-hosted, linux, x64, pr-agent]
    timeout-minutes: 45
    steps:
      - name: Load the trusted PR-Agent action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: altinkaya-opensource/altinkaya-pr-agent
          ref: latest
          token: ${{ secrets.PR_AGENT_BOT_TOKEN }}
          persist-credentials: false
          path: .pr-agent-runtime
      - name: PR-Agent review and suggestions
        uses: ./.pr-agent-runtime
        env:
          BOT_TOKEN: ${{ secrets.PR_AGENT_BOT_TOKEN }}
          LLM_API_KEY: ${{ secrets.PR_AGENT_LLM_API_KEY }}
          LLM_URL: ${{ vars.PR_AGENT_LLM_URL }}
          LLM_MODEL: ${{ vars.PR_AGENT_LLM_MODEL }}
          LLM_REASONING_EFFORT: ${{ vars.PR_AGENT_REASONING_EFFORT }}
